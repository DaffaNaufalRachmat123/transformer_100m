# ═══════════════════════════════════════════════════════════════════════════════
# Transformer 100M — Training Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[training]
batch_size=8
rate_limit=0

# ─── GPU Profiles ─────────────────────────────────────────────────────────────
# Recommended batch sizes per GPU (seq_len=256):
#   T4 (16GB)     : batch_size=70-75
#   V100 (16GB)   : batch_size=70-75
#   V100 (32GB)   : batch_size=150
#   A100 (40GB)   : batch_size=200
#   A100 (80GB)   : batch_size=400
#   RTX 3090 (24GB): batch_size=100-110
#   RTX 4090 (24GB): batch_size=110-120
#   H100 (80GB)   : batch_size=450
#
# Formula: batch_size ≈ (VRAM_GB - 1.5) × 5 for seq=256
# For longer sequences: batch = base_batch × (256 / seq_len)
#
# ─── Build instructions ───────────────────────────────────────────────────────
# Default (Kaggle T4):
#   mkdir build && cd build && cmake .. && make -j$(nproc)
#
# For other GPUs, pass -DGPU_TARGET:
#   cmake .. -DGPU_TARGET=A100
#   cmake .. -DGPU_TARGET=RTX4090
#   cmake .. -DGPU_TARGET=V100
#   cmake .. -DGPU_TARGET=ALL        # fat binary (runs on any GPU)
#
# Or uncomment the line in CMakeLists.txt directly.
