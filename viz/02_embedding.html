<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage 2: Embedding</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script></head><body>
<div class="substep-dots" id="substep-dots"></div><div id="substep-info" class="substep-info"></div>
<div id="formula-panel"></div><div id="viz-content"></div><div id="comp-detail"></div><div id="explanation"></div>
<script src="shared.js"></script><script>
initState();
let selTok=0;
function pickTok(i){selTok=i;PAGE.render(PAGE.sub);}
initStagePage(1,3,function(sub){
    const vc=document.getElementById('viz-content'),cd=document.getElementById('comp-detail'),fp=document.getElementById('formula-panel'),ex=document.getElementById('explanation');
    fp.innerHTML=texBlock(`X_i = W_{embed}[\\text{token\\_id}_i] \\quad [${CFG.seq} \\times ${CFG.d}]`);
    if(sub===0){
        let h='<div style="width:100%;position:relative">'+htmlViewToggle();
        h+='<div class="matrices-row">';
        h+='<div class="mat-wrap"><div class="mat-label">16 Token IDs</div><div style="display:flex;flex-wrap:wrap;gap:3px;max-width:120px">';
        TOKEN_IDS.forEach((id,i)=>{h+=`<div class="token-box" style="padding:2px 5px;font-size:.6rem"><span class="tok-text">${TOKENS_TEXT[i].slice(0,4)}</span><span class="tok-id">${id}</span></div>`;});
        h+='</div></div><div class="op-symbol">→</div>';
        h+=htmlHeatmap(W.embed,'emb-mat',`W_embed [${CFG.V}×${CFG.d}]`);
        h+='</div></div>';vc.innerHTML=h;
        cd.innerHTML='<div class="comp-step active"><div class="comp-line">Embedding matrix: '+CFG.V+'×'+CFG.d+' = '+CFG.V*CFG.d+' parameter. Klik sel heatmap untuk lihat value.</div></div>';
    } else if(sub===1){
        const id=TOKEN_IDS[selTok];
        let h='<div style="width:100%">'+htmlTokenSelector(selTok,'pickTok');
        h+=`<div style="text-align:center;margin:6px 0;font-size:.75rem;color:var(--dim)">Token "${TOKENS_TEXT[selTok]}" (ID=${id}) → ambil baris ke-${id} dari W_embed</div>`;
        h+=htmlVec(W.embed[id],'emb-row',`W_embed[${id}] = embedding vector`);
        h+='</div>';vc.innerHTML=h;
        let d='<div class="comp-step active"><div class="comp-line"><strong>Embedding lookup = index baris</strong></div>';
        d+=`<div class="comp-line comp-terms">X[${selTok}] = W_embed[${id}] = [${W.embed[id].slice(0,6).map(v=>fmt(v)).join(', ')}, ... +${CFG.d-6} more]</div></div>`;
        cd.innerHTML=d;
    } else {
        let h='<div style="width:100%;position:relative">'+htmlViewToggle();
        h+=htmlAuto(S.X,'X-emb',`Embedding Output X [${CFG.seq}×${CFG.d}]`);
        h+='</div>';vc.innerHTML=h;
        let d='<div class="comp-step active"><div class="comp-line">Semua 16 token telah di-embed ke vektor '+CFG.d+'-dimensi:</div>';
        for(let i=0;i<3;i++)d+=`<div class="comp-line comp-terms">X[${i}] = [${S.X[i].slice(0,5).map(v=>fmt(v)).join(', ')}, ...]</div>`;
        d+='<div class="comp-line">... ('+CFG.seq+' rows total)</div></div>';cd.innerHTML=d;
    }
    ex.textContent='Token ID → indeks baris di embedding matrix. Setara dengan one-hot × W_embed. Setiap token menjadi vektor d_model='+CFG.d+' dimensi.';
});
</script></body></html>
